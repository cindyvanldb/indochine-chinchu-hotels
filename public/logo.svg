<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Luxury Gold Gradient -->
    <linearGradient id="icGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="25%" stop-color="#E2B755" />
      <stop offset="65%" stop-color="#BE8B26" />
      <stop offset="100%" stop-color="#7A530F" />
    </linearGradient>

    <!-- Secondary Soft Gold -->
    <linearGradient id="icGoldSoft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6" />
      <stop offset="100%" stop-color="#D4A437" />
    </linearGradient>

    <!-- Rich Indochine Heritage Green Gradient (Xanh Đông Dương) -->
    <linearGradient id="icGreenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E423A" />
      <stop offset="45%" stop-color="#09332D" />
      <stop offset="100%" stop-color="#031E1A" />
    </linearGradient>

    <!-- Subtle Radial Glow for Depth -->
    <radialGradient id="icGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#186E61" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#09332D" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#031E1A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Outer Shield in Xanh Đông Dương -->
  <rect x="6" y="6" width="188" height="188" rx="36" fill="url(#icGreenBg)" stroke="url(#icGold)" stroke-width="3.5"/>
  <rect x="6" y="6" width="188" height="188" rx="36" fill="url(#icGlow)"/>
  
  <!-- Indochine Vintage Ornamental Filigree Border -->
  <rect x="15" y="15" width="170" height="170" rx="28" fill="none" stroke="#E2B755" stroke-width="1.2" stroke-dasharray="5,3" opacity="0.8"/>
  <rect x="19" y="19" width="162" height="162" rx="24" fill="none" stroke="#135D51" stroke-width="0.75"/>

  <!-- Corner Lotus Flourishes -->
  <circle cx="28" cy="28" r="2.5" fill="#E2B755" opacity="0.9" />
  <circle cx="172" cy="28" r="2.5" fill="#E2B755" opacity="0.9" />
  <circle cx="28" cy="172" r="2.5" fill="#E2B755" opacity="0.9" />
  <circle cx="172" cy="172" r="2.5" fill="#E2B755" opacity="0.9" />

  <!-- Lotus & Crown Motif (Top Center) -->
  <g transform="translate(100, 46) scale(0.68)">
    <path d="M 0 -24 C 12 -12, 20 6, 0 24 C -20 6, -12 -12, 0 -24 Z" fill="url(#icGold)" />
    <path d="M -10 -14 C -2 -7, 2 10, -18 20 C -25 5, -20 -7, -10 -14 Z" fill="#F0C766" opacity="0.95" />
    <path d="M 10 -14 C 2 -7, -2 10, 18 20 C 25 5, 20 -7, 10 -14 Z" fill="#F0C766" opacity="0.95" />
    <circle cx="0" cy="25" r="3" fill="#FFF3B0" />
    <circle cx="-9" cy="24" r="1.8" fill="#E2B755" />
    <circle cx="9" cy="24" r="1.8" fill="#E2B755" />
  </g>

  <!-- Central Monogram: Intertwined I & C in Luxury Crest -->
  <g transform="translate(100, 96)">
    <!-- Decorative Crest Ring Backdrop -->
    <circle cx="0" cy="0" r="32" fill="none" stroke="url(#icGold)" stroke-width="1" opacity="0.4" stroke-dasharray="3,3" />
    
    <!-- Outer Arc Flourishes -->
    <path d="M -26 -14 A 29 29 0 0 1 26 -14" fill="none" stroke="#E2B755" stroke-width="1.2" opacity="0.6"/>
    <path d="M -26 14 A 29 29 0 0 0 26 14" fill="none" stroke="#E2B755" stroke-width="1.2" opacity="0.6"/>

    <!-- Letter 'C' (Indochine / Chinchu) -->
    <path d="M 16 -18 C 8 -25, -6 -25, -16 -16 C -26 -6, -26 8, -16 18 C -6 27, 8 26, 16 19 L 10 13 C 4 18, -4 18, -10 12 C -17 5, -17 -4, -10 -11 C -4 -17, 4 -17, 10 -12 Z" fill="url(#icGold)" />
    
    <!-- Letter 'I' (Indochine) Intersecting Center -->
    <rect x="-3.5" y="-22" width="7" height="44" rx="2" fill="url(#icGoldSoft)" stroke="#0E423A" stroke-width="0.8" />
    <rect x="-10" y="-23" width="20" height="4" rx="1.5" fill="url(#icGold)" />
    <rect x="-10" y="19" width="20" height="4" rx="1.5" fill="url(#icGold)" />

    <!-- Center Accent Diamond -->
    <polygon points="0,-2 3.5,0 0,2 -3.5,0" fill="#FFF8D6" />
  </g>

  <!-- Elegant Brand Typography -->
  <text x="100" y="146" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="11.5" font-weight="800" text-anchor="middle" fill="url(#icGold)" letter-spacing="4">INDOCHINE</text>
  <text x="100" y="161" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="8" font-weight="700" text-anchor="middle" fill="#E2B755" letter-spacing="3.5">&amp; CHINCHU</text>
  <text x="100" y="174" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="5.5" font-weight="600" text-anchor="middle" fill="#99B8B0" letter-spacing="2.5">BOUTIQUE HOTELS</text>
</svg>
