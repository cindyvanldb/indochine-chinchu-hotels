<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Luxury Gold Gradient -->
    <linearGradient id="indochineGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="25%" stop-color="#E2B755" />
      <stop offset="65%" stop-color="#BE8B26" />
      <stop offset="100%" stop-color="#7A530F" />
    </linearGradient>

    <!-- Rich Indochine Heritage Green Gradient (Xanh Đông Dương) -->
    <linearGradient id="indochineGreenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E423A" />
      <stop offset="50%" stop-color="#09332D" />
      <stop offset="100%" stop-color="#031E1A" />
    </linearGradient>

    <!-- Subtle Radial Glow for Depth -->
    <radialGradient id="indochineGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#145A4F" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#031E1A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Outer Shield in Xanh Đông Dương -->
  <rect x="6" y="6" width="188" height="188" rx="36" fill="url(#indochineGreenBg)" stroke="url(#indochineGold)" stroke-width="3.5"/>
  <rect x="6" y="6" width="188" height="188" rx="36" fill="url(#indochineGlow)"/>
  
  <!-- Indochine Vintage Ornamental Filigree Border -->
  <rect x="15" y="15" width="170" height="170" rx="28" fill="none" stroke="#E2B755" stroke-width="1.2" stroke-dasharray="5,3" opacity="0.75"/>
  <rect x="19" y="19" width="162" height="162" rx="24" fill="none" stroke="#135D51" stroke-width="0.75"/>

  <!-- Corner Lotus Flourishes -->
  <circle cx="28" cy="28" r="2.5" fill="#E2B755" opacity="0.9" />
  <circle cx="172" cy="28" r="2.5" fill="#E2B755" opacity="0.9" />
  <circle cx="28" cy="172" r="2.5" fill="#E2B755" opacity="0.9" />
  <circle cx="172" cy="172" r="2.5" fill="#E2B755" opacity="0.9" />

  <!-- Lotus / Indochine Floral Crown Motif -->
  <g transform="translate(100, 52) scale(0.72)">
    <!-- Central lotus petal -->
    <path d="M 0 -26 C 14 -12, 22 8, 0 26 C -22 8, -14 -12, 0 -26 Z" fill="url(#indochineGold)" />
    <!-- Left petal -->
    <path d="M -12 -16 C -2 -8, 2 12, -20 22 C -28 6, -22 -8, -12 -16 Z" fill="#F0C766" opacity="0.95" />
    <!-- Right petal -->
    <path d="M 12 -16 C 2 -8, -2 12, 20 22 C 28 6, 22 -8, 12 -16 Z" fill="#F0C766" opacity="0.95" />
    <!-- Base bud ornament -->
    <circle cx="0" cy="27" r="3.5" fill="#FFF3B0" />
    <circle cx="-10" cy="26" r="2" fill="#E2B755" />
    <circle cx="10" cy="26" r="2" fill="#E2B755" />
  </g>

  <!-- Monogram IC (Indochine Casa) in Playfair / French Heritage Serif -->
  <text x="100" y="122" font-family="'Playfair Display', Georgia, serif" font-size="46" font-weight="900" text-anchor="middle" fill="url(#indochineGold)" letter-spacing="4">IC</text>

  <!-- Brand Typography -->
  <text x="100" y="148" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle" fill="#FFF3B0" letter-spacing="3.5">INDOCHINE</text>
  <text x="100" y="165" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="#E2B755" letter-spacing="4.5">CASA HOTEL</text>
  
  <!-- Subtle Gold Star Accents -->
  <circle cx="52" cy="144" r="1.8" fill="#E2B755" />
  <circle cx="148" cy="144" r="1.8" fill="#E2B755" />
</svg>
