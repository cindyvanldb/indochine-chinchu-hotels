<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Matching Luxury Gold Gradient -->
    <linearGradient id="chinchuGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="25%" stop-color="#E2B755" />
      <stop offset="65%" stop-color="#BE8B26" />
      <stop offset="100%" stop-color="#7A530F" />
    </linearGradient>

    <!-- Rich Indochine Heritage Green Gradient (Xanh Đông Dương) -->
    <linearGradient id="chinchuGreenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E423A" />
      <stop offset="50%" stop-color="#09332D" />
      <stop offset="100%" stop-color="#031E1A" />
    </linearGradient>

    <!-- Subtle Radial Glow for Depth -->
    <radialGradient id="chinchuGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#145A4F" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#031E1A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Outer Shield in Xanh Đông Dương -->
  <rect x="6" y="6" width="188" height="188" rx="36" fill="url(#chinchuGreenBg)" stroke="url(#chinchuGold)" stroke-width="3.5"/>
  <rect x="6" y="6" width="188" height="188" rx="36" fill="url(#chinchuGlow)"/>
  
  <!-- Sleek Geometric Luxury Inner Frame -->
  <rect x="15" y="15" width="170" height="170" rx="28" fill="none" stroke="#E2B755" stroke-width="1.2" stroke-dasharray="5,3" opacity="0.75"/>
  <rect x="19" y="19" width="162" height="162" rx="24" fill="none" stroke="#135D51" stroke-width="0.75"/>

  <!-- Corner Accents -->
  <circle cx="28" cy="28" r="2.5" fill="#E2B755" opacity="0.9" />
  <circle cx="172" cy="28" r="2.5" fill="#E2B755" opacity="0.9" />
  <circle cx="28" cy="172" r="2.5" fill="#E2B755" opacity="0.9" />
  <circle cx="172" cy="172" r="2.5" fill="#E2B755" opacity="0.9" />

  <!-- Luxury Crown / Three Star Icon -->
  <g transform="translate(100, 48) scale(0.85)">
    <!-- Center star -->
    <path d="M 0 -17 L 3 -7 L 13 -7 L 5 -2 L 8 8 L 0 3 L -8 8 L -5 -2 L -13 -7 L -3 -7 Z" fill="url(#chinchuGold)" />
    <!-- Left small star -->
    <path d="M 0 -14 L 2.5 -5 L 10 -5 L 4 -1 L 6 6 L 0 2 L -6 6 L -4 -1 L -10 -5 L -2.5 -5 Z" fill="#F0C766" opacity="0.85" transform="translate(-24, 2) scale(0.8)" />
    <!-- Right small star -->
    <path d="M 0 -14 L 2.5 -5 L 10 -5 L 4 -1 L 6 6 L 0 2 L -6 6 L -4 -1 L -10 -5 L -2.5 -5 Z" fill="#F0C766" opacity="0.85" transform="translate(24, 2) scale(0.8)" />
  </g>

  <!-- Modern Luxury Monogram / Crest (CC interlock) -->
  <g transform="translate(100, 96)">
    <!-- First C -->
    <path d="M -10 -24 C -26 -24, -36 -12, -36 0 C -36 12, -26 24, -10 24 C -2 24, 6 20, 10 14 L 2 9 C -1 13, -5 16, -10 16 C -20 16, -26 8, -26 0 C -26 -8, -20 -16, -10 -16 C -5 -16, -1 -13, 2 -9 L 10 -14 C 6 -20, -2 -24, -10 -24 Z" fill="url(#chinchuGold)" />
    <!-- Second C mirrored/nested -->
    <path d="M 10 -24 C 2 -24, -6 -20, -10 -14 L -2 -9 C 1 -13, 5 -16, 10 -16 C 20 -16, 26 -8, 26 0 C 26 8, 20 16, 10 16 C 5 16, 1 13, -2 9 L -10 14 C -6 20, 2 24, 10 24 C 26 24, 36 12, 36 0 C 36 -12, 26 -24, 10 -24 Z" fill="#F0C766" opacity="0.95" />
  </g>

  <!-- Brand Typography -->
  <text x="100" y="148" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="900" text-anchor="middle" fill="url(#chinchuGold)" letter-spacing="5">CHINCHU</text>
  <text x="100" y="165" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle" fill="#E2B755" letter-spacing="3.8">LUXURY &amp; STAY</text>
</svg>
